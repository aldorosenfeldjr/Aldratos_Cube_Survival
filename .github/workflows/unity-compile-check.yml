name: Unity Compile Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: unity-compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Windows target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ github.repository }}
          restore-keys: |
            Library-

      - name: Compile project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          # Uses game-ci's default build script (no buildMethod override) -
          # a failed compile fails this step, which is all this workflow
          # checks for; the resulting player build itself is discarded.
